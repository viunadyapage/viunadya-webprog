<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Nilai Mahasiswa</title>
</head>
<body>
    <h2>Cek Nilai Mahasiswa</h2>
    <form id="formNilai">
        <label for="nim">NIM:</label>
        <input type="text" id="nim" required><br><br>

        <label for="nilai">Nilai:</label>
        <input type="number" id="nilai" required><br><br>

        <button type="submit">Cek Nilai</button>
    </form>

    <h3>Hasil:</h3>
    <p id="hasil"></p>

    <script src="script.js"></script>
</body>
</html>
