<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Workshop</title>
    <style>
        table {
            border-collapse: collapse;
        }
        td {
            padding: 5px;
        }
        h2, p {
            text-align: center;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <h2>Pendaftaran Workshop: <br> "Explore Yourself: Unlock Your Potential!"</h2>
    <p>Form ini hanya merupakan demo untuk tugas 2 PBW.</p>

    <form id="formPendaftaran">
        <table border="1" align="center">
            <tr>
                <td>Nama:</td>
                <td><input type="text" name="nama" required></td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="email" name="email" required></td>
            </tr>
            <tr>
                <td>Jenis Kelamin:</td>
                <td>
                    <input type="radio" name="gender" value="Laki-laki" required> Laki-laki
                    <input type="radio" name="gender" value="Perempuan"> Perempuan
                </td>
            </tr>
            <tr>
                <td>Hobi:</td>
                <td>
                    <input type="checkbox" name="hobi" value="Musik"> Musik
                    <input type="checkbox" name="hobi" value="Olahraga"> Olahraga
                    <input type="checkbox" id="hobiLainCheckbox"> Hobi Lain
                    <br>
                    <input type="text" id="hobiLainInput" name="hobi_lain" placeholder="Tulis hobi anda" style="display: none;">
                </td>
            </tr>
            <tr>
                <td>Pilih Kota:</td>
                <td>
                    <select name="kota" id="kota" required>
                        <option value="">Pilih Kota</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Upload Foto:</td>
                <td><input type="file" name="foto" required></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <button type="submit">Daftar</button>
                </td>
            </tr>
        </table>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch("kota.txt")
                .then(res => res.text())
                .then(data => {
                    let daftarKota = data.split("\n").map(kota => kota.trim()).filter(kota => kota !== "");
                    let kotaSelect = document.getElementById("kota");

                    daftarKota.forEach(kota => {
                        let opsi = document.createElement("option");
                        opsi.value = kota;
                        opsi.textContent = kota;
                        kotaSelect.appendChild(opsi);
                    });
                })
                .catch(err => console.log("Gagal mengambil data kota: ", err));
            document.getElementById("hobiLainCheckbox").addEventListener("change", function() {
                    let inputHobiLain = document.getElementById("hobiLainInput");
                    inputHobiLain.style.display = this.checked ? "block" : "none";
                });
            document.getElementById("formPendaftaran").addEventListener("submit", function(event) {
                event.preventDefault();
                window.location.href = "sukses.html";
            });
        });
    </script>

</body>
</html>
